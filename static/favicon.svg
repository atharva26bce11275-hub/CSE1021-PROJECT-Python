<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Metallic Glass Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9" />
    </linearGradient>

    <!-- Left Page Wing Gradient -->
    <linearGradient id="leftPageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Right Page Wing Gradient -->
    <linearGradient id="rightPageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container Base with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="504" height="504" rx="106" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.9" />

  <!-- Ambient Glow Circle behind logo -->
  <circle cx="256" cy="256" r="160" fill="#2563eb" opacity="0.2" filter="url(#glow)" />

  <!-- Main Logo Symbol: Open illuminated book with crest -->
  <g filter="url(#shadow)">
    <!-- Spine Line -->
    <path d="M 256 128 L 256 384" stroke="#93c5fd" stroke-width="12" stroke-linecap="round" />

    <!-- Left Page Wing -->
    <path d="M 256 144 C 210 120, 140 120, 104 136 C 96 140, 90 148, 90 158 L 90 354 C 90 366, 102 374, 114 370 C 146 358, 206 358, 256 376 Z" fill="url(#leftPageGrad)" />

    <!-- Right Page Wing -->
    <path d="M 256 144 C 302 120, 372 120, 408 136 C 416 140, 422 148, 422 158 L 422 354 C 422 366, 410 374, 398 370 C 366 358, 306 358, 256 376 Z" fill="url(#rightPageGrad)" />

    <!-- Inner Floating Accent Pages -->
    <path d="M 256 180 C 220 160, 160 160, 126 174 L 126 330 C 158 318, 216 318, 256 334 Z" fill="#60a5fa" opacity="0.45" />
    <path d="M 256 180 C 292 160, 352 160, 386 174 L 386 330 C 354 318, 296 318, 256 334 Z" fill="#a5b4fc" opacity="0.45" />

    <!-- Central Gold Star Crest -->
    <path d="M 256 90 L 263 112 L 284 112 L 267 126 L 273 148 L 256 134 L 239 148 L 245 126 L 228 112 L 249 112 Z" fill="url(#accentGrad)" opacity="0.95" />
  </g>
</svg>
